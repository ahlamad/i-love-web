    <meta charset="UTF-8">

    <title>Improvisize website</title>
    <link rel="stylesheet" href="styles/command.css">
    <script defer src="script.js"></script>
  </head>

  <body>
    <header class="header">

                <label for="search-input" class="search-wrapper">
                <svg class="search-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="25" height="25" stroke-width="1.5" aria-hidden="true" data-part="search-icon"><path d="M21.4 21.4L17.5 17.5M17.8 10.2C17.8 14.3 14.4 17.7 10.3 17.7C6.20005 17.7 2.80005 14.3 2.80005 10.2C2.80005 6.10001 6.20005 2.70001 10.3 2.70001C14.4 2.70001 17.8 6.10001 17.8 10.2Z" stroke="currentColor"></path></svg>

    </header>

    <main>
      <section class="dialog">
        <button commandfor="mydialog" command="show-modal">Show dialog</button>
        <dialog id="mydialog">
          Hoi! Sluit mij weer via "Close"
            <button commandfor="mydialog" command="close">Close</button>
        </dialog>
      </section>

      <section class="command-voker-spinners">
        <div class="button-wrapper">
          <button commandfor="my-img" command="--rotate-left">Rotate left</button>
          <button commandfor="my-img" command="--rotate-right">Rotate right</button>
          <button commandfor="my-img" command="--rotate-normal">Rotate back to normal</button>
          <button commandfor="my-img" command="--rotate-bottom">Full rotate</button>
          <button commandfor="my-img" command="--translate-down">Move downwards</button>
        </div>
        <img id="my-img" src="amsterdam.jpeg" alt="Amsterdamse gracht" width="300" height="300"/>

      </section>

      <section class="meter-stars-section">
        <meter value="5" min="1" max="5" title="GB"></meter>
        
        <div class="meter-stars">
          <span></span>
        </div>
      </section>
    </main>
  </body>
</html>
